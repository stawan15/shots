name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Run self-checks
        run: swift run -c release shots-selftest

      - name: Build the app bundle
        run: ./build-app.sh

      - name: Render the popover headlessly
        run: .build/release/ShotsApp --preview "$RUNNER_TEMP/ui.png"

      - name: Verify the preview is not blank
        run: |
          test -s "$RUNNER_TEMP/ui.png"
          echo "preview: $(stat -f%z "$RUNNER_TEMP/ui.png") bytes"
