name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The naming engine is pure Swift with no AppKit or Vision dependency, so its
  # checks run on Linux where hosted runners are free. macOS runners are billed
  # per minute and are cancelled immediately on this account, so the macOS-only
  # build stays local (or becomes a job here once minutes are available).
  selftest:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build the naming engine
        run: swift build -c release --product shots-selftest

      - name: Run the checks
        run: .build/release/shots-selftest

  # Enable by removing `if: false` when macOS runner minutes are available.
  # This is the real verification path: Vision, the app bundle and its rendering.
  macos:
    runs-on: macos-14
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: swift run -c release shots-selftest
      - run: ./build-app.sh
      - run: .build/release/ShotsApp --preview "$RUNNER_TEMP/ui.png"
      - run: test -s "$RUNNER_TEMP/ui.png"
